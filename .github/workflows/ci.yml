name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: テスト (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: テストを実行（依存ライブラリなし）
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: CLI が起動することを確認
        env:
          PYTHONPATH: src
        run: |
          python -m miharun --version
          python -m miharun --help

      - name: サンプルレポートを生成できることを確認
        env:
          PYTHONPATH: src
        run: python examples/make_example.py

  lint:
    name: 構文と文字の健全性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 全ファイルが構文として正しいか
        run: python -m compileall -q src tests scripts examples

      - name: 文字化け（U+FFFD）が混入していないか
        run: python scripts/check_text_health.py

      - name: 日本語以外の文字が混入していないか
        run: python scripts/check_text_health.py --strict
